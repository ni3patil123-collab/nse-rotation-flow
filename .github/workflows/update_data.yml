name: NSE Live Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 3-10 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp requests pandas logzero websocket-client

      - name: Run Trading Script
        env:
          ANGEL_API_KEY: ${{ secrets.API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.MPIN }}
          ANGEL_TOTP_KEY: ${{ secrets.TOTP_KEY }}
        run: |
          python main.py

      - name: Commit and Push Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json signal_state.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update live NSE market data"
            git push
          fi
