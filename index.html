<script>

/* =========================
   BASIC CONFIG
========================= */

const sectors = [
"METAL",
"IT",
"PHARMA",
"BANKING",
"FINANCIAL",
"AUTO",
"REALTY",
"CEMENT",
"ENERGY",
"FMCG",
"CHEMICAL",
"CAPITAL_GOODS",
"TELECOM",
"CONSUMER",
"DEFENSE"
];

let liveData = {
last_updated:"",
market_date:"",
status:"MARKET CLOSED",
rotation:[],
scanner:[],
big_player:[],
final_dashboard:[]
};

const scannerSettings = {
direction:"SELL",
usePDH:true,
usePDL:true
};


/* =========================
   INIT
========================= */

function init(){

const sel=document.getElementById("sector");

/* ALWAYS SHOW ALL 15 SECTORS */
sel.innerHTML=sectors
.map(s=>`<option value="${s}">${s}</option>`)
.join("");

initScannerControls();

clearBrowserDemo();

loadSavedData();

}


/* =========================
   NO FAKE DATA
========================= */

function clearBrowserDemo(){

document.getElementById("heat").innerHTML=
sectors.map((name,i)=>{

return `
<div class="sector"
onclick="pick('${name}')">

<div class="row">

<span class="sname">
#${i+1} ${name}
</span>

<span class="move">
--%
</span>

</div>

<div class="boxes">

${Array.from(
{length:8},
()=>`<i class="box"></i>`
).join("")}

</div>

<div class="rank">
WAITING FOR LIVE DATA
</div>

</div>
`;

}).join("");

document.getElementById("stocks").innerHTML=
`<div class="muted" style="padding:18px 0">
NO STOCK DATA
</div>`;

document.getElementById("top6").innerHTML=
`<div class="muted" style="padding:18px 0">
NO STRONG FLOW
</div>`;

}


/* =========================
   LOAD DATA.JSON
========================= */

async function loadSavedData(){

try{

const response=await fetch(
"data.json?t="+Date.now(),
{
cache:"no-store"
}
);

if(!response.ok){
throw new Error("data.json not available");
}

const data=await response.json();

liveData=data || liveData;

updateHeader();

renderRotation();

renderScanner();

renderBigPlayer();

renderFinal();

document.getElementById("systemStatus").innerText=
"Backend data connected • "+
formatTime(liveData.last_updated);

}
catch(error){

console.log(
"Waiting for data.json...",
error
);

document.getElementById("systemStatus").innerText=
"Waiting for backend NSE data...";

}

}


/* =========================
   TIME
========================= */

function formatTime(value){

if(!value){
return "--:--";
}

try{

const d=new Date(value);

if(isNaN(d.getTime())){
return String(value);
}

return d.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
hour12:false,
timeZone:"Asia/Kolkata"
}
);

}
catch(e){

return String(value);

}

}


/* =========================
   HEADER
========================= */

function updateHeader(){

const status=
String(
liveData.status ||
liveData.market_status ||
"NO CLEAR"
).toUpperCase();

document.getElementById("mstatus").innerText=
status;

document.getElementById("update").innerText=
formatTime(liveData.last_updated);

/* MARKET OPEN = LIVE */

const isLive=
status==="MARKET OPEN" ||
status==="LIVE" ||
status==="OPEN";

document.getElementById("liveText").innerText=
isLive ? "LIVE" : status;

const dot=
document.querySelector(".dot");

if(isLive){

dot.style.background=
"var(--green)";

}
else{

dot.style.background=
"var(--red)";

}

}


/* =========================
   ROTATION
========================= */

function renderRotation(){

/*
IMPORTANT:
Python data.json uses:
rotation:[...]

OLD HTML was looking for:
sectors:[...]

FIXED HERE
*/

const list=
Array.isArray(liveData.rotation)
? liveData.rotation
:[];


/* KEEP ALL 15 SECTORS EVEN IF DATA IS EMPTY */

const map={};

list.forEach(item=>{

const name=
String(
item.sector ||
item.name ||
""
).toUpperCase();

if(name){
map[name]=item;
}

});


document.getElementById("heat").innerHTML=
sectors.map((name,i)=>{

/* support DEFENCE / DEFENSE naming */

let item=
map[name];

if(!item && name==="DEFENSE"){
item=map["DEFENCE"];
}

if(!item && name==="DEFENCE"){
item=map["DEFENSE"];
}


/* NO DATA FOR THIS SECTOR */

if(!item){

return `
<div class="sector"
onclick="pick('${name}')">

<div class="row">

<span class="sname">
#${i+1} ${name}
</span>

<span class="move">
--%
</span>

</div>

<div class="boxes">

${Array.from(
{length:8},
()=>`<i class="box"></i>`
).join("")}

</div>

<div class="rank">
WAITING FOR LIVE DATA
</div>

</div>
`;

}


const value=
Number(
item.move ??
item.change ??
item.value ??
0
);

const arrow=
value>=0 ? "↑" : "↓";


/*
Use backend stage if available.
Otherwise preserve original rank logic.
*/

let stage=
String(
item.stage ||
""
).toUpperCase();

if(!stage){

stage=
i<5
?"STRONG"
:i<10
?"NEUTRAL"
:"WEAK";

}


/* heat strength */

const allMoves=
list.map(x=>
Math.abs(
Number(
x.move ??
x.change ??
x.value ??
0
)
)
);

const maxAbs=
Math.max(
...allMoves,
0.0001
);

const n=
Math.max(
1,
Math.min(
8,
Math.round(
Math.abs(value)/maxAbs*8
)
)
);


let cls="y";

if(stage==="STRONG"){
cls="g";
}
else if(stage==="WEAK"){
cls="r";
}
else{
cls="y";
}


return `
<div class="sector"
onclick="pick('${name}')">

<div class="row">

<span class="sname">
#${i+1} ${name}
</span>

<span class="move">
${arrow}
${value>=0?"+":""}${value.toFixed(2)}%
</span>

</div>

<div class="boxes">

${Array.from(
{length:8},
(_,j)=>
`<i class="box ${
j>=8-n ? cls : ""
}"></i>`
).join("")}

</div>

<div class="rank">
${stage}
</div>

</div>
`;

}).join("");

}


/* =========================
   SCANNER CONTROLS
========================= */

function initScannerControls(){

document
.getElementById("directionBuy")
.addEventListener(
"click",
()=>setDirection("BUY")
);

document
.getElementById("directionSell")
.addEventListener(
"click",
()=>setDirection("SELL")
);

document
.getElementById("directionBoth")
.addEventListener(
"click",
()=>setDirection("BOTH")
);

document
.getElementById("pdhToggle")
.addEventListener(
"click",
()=>toggleFilter("PDH")
);

document
.getElementById("pdlToggle")
.addEventListener(
"click",
()=>toggleFilter("PDL")
);

document
.getElementById("sector")
.addEventListener(
"change",
renderScanner
);

paintScannerControls();

}


/* =========================
   CONTROLS
========================= */

function paintScannerControls(){

document
.getElementById("directionBuy")
.classList.toggle(
"active",
scannerSettings.direction==="BUY"
);

document
.getElementById("directionSell")
.classList.toggle(
"active",
scannerSettings.direction==="SELL"
);

document
.getElementById("directionBoth")
.classList.toggle(
"active",
scannerSettings.direction==="BOTH"
);

const pdh=
document.getElementById("pdhToggle");

const pdl=
document.getElementById("pdlToggle");

pdh.innerText=
"PDH BUY: "+
(
scannerSettings.usePDH
?"ON"
:"OFF"
);

pdh.className=
"setting-btn "+
(
scannerSettings.usePDH
?"on"
:"off"
);

pdl.innerText=
"PDL SELL: "+
(
scannerSettings.usePDL
?"ON"
:"OFF"
);

pdl.className=
"setting-btn "+
(
scannerSettings.usePDL
?"on"
:"off"
);

}


function setDirection(direction){

scannerSettings.direction=
direction;

paintScannerControls();

renderScanner();

}


function toggleFilter(type){

if(type==="PDH"){

scannerSettings.usePDH=
!scannerSettings.usePDH;

}
else{

scannerSettings.usePDL=
!scannerSettings.usePDL;

}

paintScannerControls();

renderScanner();

}


/* =========================
   SCANNER
========================= */

function renderScanner(){

const selected=
document.getElementById("sector").value;

let list=
Array.isArray(liveData.scanner)
? [...liveData.scanner]
:[];


/*
IMPORTANT:
Selected sector is only a UI filter.
ALL 15 sectors remain in dropdown.
*/

list=list.filter(x=>{

const sector=
String(
x.sector ||
x.sector_name ||
""
).toUpperCase();

return sector===selected;

});


/* DIRECTION FILTER */

if(scannerSettings.direction!=="BOTH"){

list=list.filter(x=>{

const direction=
String(
x.direction ||
x.signal ||
x.side ||
""
).toUpperCase();

return direction===
scannerSettings.direction;

});

}


/* FLOW */

let buyCount=0;
let sellCount=0;

list.forEach(x=>{

const d=
String(
x.direction ||
x.signal ||
x.side ||
""
).toUpperCase();

if(d==="BUY"){
buyCount++;
}

if(d==="SELL"){
sellCount++;
}

});

const total=
buyCount+sellCount;

const buyPct=
total
?Math.round(buyCount/total*100)
:0;

const sellPct=
total
?100-buyPct
:0;

document.getElementById("buyPct").innerText=
buyPct+"%";

document.getElementById("sellPct").innerText=
sellPct+"%";

document.getElementById("buyBar").style.width=
buyPct+"%";

document.getElementById("sellBar").style.width=
sellPct+"%";


/* EARLY / FINAL */

const early=
list.filter(x=>
String(
x.stage ||
x.type ||
""
).toUpperCase()==="EARLY"
).length;

const final=
list.filter(x=>
String(
x.stage ||
x.type ||
""
).toUpperCase()==="FINAL"
).length;

document.getElementById("early").innerText=
early;

document.getElementById("fin").innerText=
final;


/* PASS TIME */

let firstPass="--:--";

for(const x of list){

if(x.pass_time){

firstPass=
formatTime(x.pass_time);

break;

}

if(x.passTime){

firstPass=
formatTime(x.passTime);

break;

}

}

document.getElementById("passTime").innerText=
firstPass;


/* STOCK LIST */

if(!list.length){

document.getElementById("stocks").innerHTML=
`<div class="muted" style="padding:18px 0">
NO STOCK PASS
</div>`;

return;

}


document.getElementById("stocks").innerHTML=
list.map(x=>{

const symbol=
x.symbol ||
x.stock ||
x.name ||
"--";

const direction=
String(
x.direction ||
x.signal ||
x.side ||
""
).toUpperCase();

const stage=
x.stage ||
x.type ||
"";

const pass=
x.pass_time ||
x.passTime ||
"--:--";

const rvol=
x.rvol20 ??
x.rvol ??
"--";

return `
<div class="stock"
onclick="detail('${symbol}')">

<div>

<b>${symbol}</b>

<div class="stage">

TRUE 20D RVOL •
${formatTime(pass)} •
${stage}

${
rvol!=="--"
?" • RVOL "+Number(rvol).toFixed(2)
:""
}

</div>

</div>

<span class="badge ${
direction==="BUY"
?"buybg"
:"sellbg"
}">
${direction || "--"}
</span>

</div>
`;

}).join("");

}


/* =========================
   BIG PLAYER
========================= */

function renderBigPlayer(){

const list=
Array.isArray(liveData.big_player)
? liveData.big_player
:[];


if(!list.length){

document.getElementById("top6").innerHTML=
`<div class="muted" style="padding:18px 0">
NO STRONG FLOW
</div>`;

document.getElementById("bigBuyPct").innerText=
"--%";

document.getElementById("bigSellPct").innerText=
"--%";

return;

}


let buy=0;
let sell=0;

list.forEach(x=>{

const d=
String(
x.direction ||
x.signal ||
""
).toUpperCase();

if(d==="BUY"){
buy++;
}

if(d==="SELL"){
sell++;
}

});

const total=
buy+sell;

const buyPct=
total
?Math.round(buy/total*100)
:0;

const sellPct=
total
?100-buyPct
:0;

document.getElementById("bigBuyPct").innerText=
buyPct+"%";

document.getElementById("bigSellPct").innerText=
sellPct+"%";


const top=
list.slice(0,6);

document.getElementById("top6").innerHTML=
top.map((x,i)=>{

const symbol=
x.symbol ||
x.stock ||
x.name ||
"--";

const direction=
String(
x.direction ||
x.signal ||
""
).toUpperCase();

const score=
x.score ??
"--";

const flow=
x.flow ??
x.money_flow ??
"--";

const reason=
x.reason ||
x.stage ||
"FLOW";

return `
<div class="player">

<div class="muted">
#${i+1}
</div>

<b>${symbol}</b>

<div class="score ${
direction==="BUY"
?"buy"
:"sell"
}">
${direction || "--"} • ${score}
</div>

<div class="metric">
Money Flow ${flow}
</div>

<div class="metric">
${reason}
</div>

<div class="metric">
Profit Booking: only on confirmed trend end
</div>

</div>
`;

}).join("");

}


/* =========================
   FINAL DASHBOARD
========================= */

function renderFinal(){

/*
IMPORTANT:
Python data.json uses:
final_dashboard:[...]

OLD HTML was expecting:
final:{}

FIXED HERE.
*/

const list=
Array.isArray(liveData.final_dashboard)
?liveData.final_dashboard
:[];


/* NO FINAL DATA */

if(!list.length){

document.getElementById("market").innerText=
"NO CLEAR DIRECTION";

document.getElementById("lead").innerText=
"--";

document.getElementById("qual").innerText=
"--";

setConfirm(
"sectorConfirm",
false
);

setConfirm(
"stockConfirm",
false
);

setConfirm(
"flowConfirm",
false
);

return;

}


/*
Take first confirmed backend result.
No signal is created here.
*/

const f=list[0] || {};

const direction=
String(
f.direction ||
f.signal ||
"NO CLEAR DIRECTION"
).toUpperCase();

document.getElementById("market").innerText=
direction;

document.getElementById("lead").innerText=
f.sector ||
f.leading_sector ||
f.lead_sector ||
"--";

document.getElementById("qual").innerText=
f.symbol ||
f.stock ||
f.qualifying_stock ||
"--";


/*
Backend final_dashboard is already
cross-confirmed by Python.
*/

setConfirm(
"sectorConfirm",
f.sector_confirm ??
true
);

setConfirm(
"stockConfirm",
f.stock_confirm ??
true
);

setConfirm(
"flowConfirm",
f.flow_confirm ??
true
);

}


function setConfirm(id,value){

const el=
document.getElementById(id);

const yes=
value===true ||
value==="true" ||
value==="YES" ||
value==="CONFIRM";

if(yes){

el.innerText=
"✓ CONFIRM";

el.className=
"yes";

}
else{

el.innerText=
"✕ WAIT";

el.className=
"no";

}

}


/* =========================
   NAVIGATION
========================= */

function show(id,btn){

document
.querySelectorAll("section")
.forEach(x=>
x.classList.add("hidden")
);

document
.getElementById(id)
.classList.remove("hidden");

document
.querySelectorAll(".nav button")
.forEach(b=>
b.classList.remove("active")
);

if(btn){

btn.classList.add("active");

}

}


/* =========================
   SECTOR PICK
========================= */

function pick(sector){

const select=
document.getElementById("sector");

/*
DEFENSE / DEFENCE compatibility
*/

let target=sector;

if(
sector==="DEFENCE" &&
!Array.from(select.options)
.some(o=>o.value==="DEFENCE")
){

target="DEFENSE";

}

if(
sector==="DEFENSE" &&
!Array.from(select.options)
.some(o=>o.value==="DEFENSE")
){

target="DEFENCE";

}

const exists=
Array.from(select.options)
.some(o=>o.value===target);

if(exists){

select.value=
target;

}

show(
"scanner",
document.querySelectorAll(".nav button")[1]
);

renderScanner();

}


/* =========================
   DETAIL
========================= */

function detail(symbol){

document.getElementById("detailTitle").innerText=
symbol+" • 5M Chart";

show(
"detail",
null
);

}


/* =========================
   THEME
========================= */

function toggleTheme(){

document.body.classList.toggle("light");

if(
document.body.classList.contains("light")
){

document.documentElement.style
.setProperty(
"--bg",
"#f4f8fc"
);

document.documentElement.style
.setProperty(
"--card",
"#fff"
);

document.documentElement.style
.setProperty(
"--card2",
"#fff"
);

document.documentElement.style
.setProperty(
"--text",
"#17324d"
);

document.documentElement.style
.setProperty(
"--muted",
"#71869a"
);

document.documentElement.style
.setProperty(
"--line",
"#dce7f0"
);

document.body.style.background=
"#f4f8fc";

}
else{

document.documentElement.style
.setProperty(
"--bg",
"#07111f"
);

document.documentElement.style
.setProperty(
"--card",
"#0d1b2d"
);

document.documentElement.style
.setProperty(
"--card2",
"#11243a"
);

document.documentElement.style
.setProperty(
"--text",
"#edf5ff"
);

document.documentElement.style
.setProperty(
"--muted",
"#91a7bd"
);

document.documentElement.style
.setProperty(
"--line",
"#1c334b"
);

document.body.style.background=
"linear-gradient(180deg,#06101d,#0a1727)";

}

}


/* =========================
   START
========================= */

window.addEventListener(
"load",
init
);


/* =========================
   AUTO REFRESH
========================= */

setInterval(
loadSavedData,
30000
);

</script>
